name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK package and version
        working-directory: android
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/aapt"
          "$AAPT" dump badging "$APK" | tee apk-metadata.txt
          grep -q "versionName='1.5.15'" apk-metadata.txt
          grep -q "versionCode='33'" apk-metadata.txt
          mkdir -p ../verified-apk
          cp "$APK" ../verified-apk/UniversalACRemote-v1.5.15.apk
          sha256sum ../verified-apk/UniversalACRemote-v1.5.15.apk | tee ../verified-apk/SHA256.txt
          cp apk-metadata.txt ../verified-apk/APK-METADATA.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalACRemote-v1.5.15-run-${{ github.run_number }}
          path: verified-apk/*
          if-no-files-found: error
